name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware lint resolves the tests' self-import of the package, so
      # lib/ has to exist first.
      - run: pnpm build:lib
      - run: pnpm typecheck
      - run: pnpm lint
      # Builds lib/, type-checks the tests against it, then runs them as a
      # consumer of the built package.
      - run: pnpm test
