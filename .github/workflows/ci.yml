name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware lint resolves the tests' self-import of the package, so
      # lib/ has to exist first.
      - run: pnpm build:lib
      - run: pnpm typecheck
      - run: pnpm lint
      # Builds lib/, type-checks the tests against it, then runs them as a
      # consumer of the built package.
      - run: pnpm test

  # Wiredeck's acceptance test: six charts in dark and light on 1920x1080
  # slides, through headless Chromium at device pixel ratios 1, 2 and 3, then
  # printed to PDF. Runs in the same Playwright image the committed baselines
  # are made in (pnpm acceptance:update), so the comparison is pixel-exact.
  acceptance:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: pnpm acceptance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-diffs
          path: |
            test-results
            playwright-report
